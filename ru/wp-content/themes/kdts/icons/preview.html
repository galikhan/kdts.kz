<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KDTS icon pack</title>
<style>
  body { font-family: -apple-system, 'Inter', sans-serif; background:#0B2335; color:#fff; padding:40px; margin:0; }
  h1 { font-size:18px; margin:0 0 6px; }
  p.hint { font-size:13px; opacity:.6; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
  .cell { background:#122d42; border:1px solid #1a3a55; border-radius:10px; padding:20px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cell svg { width:26px; height:26px; }
  .cell code { font-size:11px; opacity:.65; text-align:center; word-break:break-all; }
  .cell code.copied { opacity:1; color:#2e9b5d; }
  .cell { cursor:pointer; }
</style>
</head>
<body>
<h1>KDTS icon pack</h1>
<p class="hint">Every &lt;symbol&gt; in sprite.svg, read live from that file — add an icon there and it shows up here automatically. Click a tile to copy its usage snippet.</p>
<div class="grid" id="grid"></div>
<script>
fetch('sprite.svg')
  .then(r => r.text())
  .then(svgText => {
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const grid = document.getElementById('grid');
    doc.querySelectorAll('symbol').forEach(sym => {
      const id = sym.getAttribute('id');
      const cell = document.createElement('div');
      cell.className = 'cell';
      const svgAttrs = ['fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin']
        .map(a => sym.getAttribute(a) ? `${a}="${sym.getAttribute(a)}"` : '')
        .join(' ');
      cell.innerHTML =
        `<svg viewBox="${sym.getAttribute('viewBox')}" ${svgAttrs}>${sym.innerHTML}</svg>` +
        `<code>${id}</code>`;
      cell.addEventListener('click', () => {
        const snippet = `<svg class="icon"><use href="#${id}"></use></svg>`;
        navigator.clipboard.writeText(snippet).catch(() => {});
        const code = cell.querySelector('code');
        const original = code.textContent;
        code.textContent = 'copied!';
        code.classList.add('copied');
        setTimeout(() => { code.textContent = original; code.classList.remove('copied'); }, 900);
      });
      grid.appendChild(cell);
    });
  });
</script>
</body>
</html>
